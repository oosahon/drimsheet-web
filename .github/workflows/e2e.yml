name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # ── Postgres (test DB for pl-core) ─────────────────────────────────────
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: purple_ledger_core_test
          POSTGRES_PASSWORD: ${{ secrets.PL_CORE_POSTGRES_PASSWORD }}
          POSTGRES_DB: pg_test_purple_ledger
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ── Redis (BullMQ / caching for pl-core) ───────────────────────────────
      redis:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ── Checkout both repos ───────────────────────────────────────────────
      - name: Checkout pl-web
        uses: actions/checkout@v4

      - name: Checkout pl-core
        uses: actions/checkout@v4
        with:
          repository: purple-ledger/purple-ledger-core # ← update if org name differs
          path: pl-core
          token: ${{ secrets.GH_PAT }} # PAT with repo:read for pl-core

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Backend (pl-core) ─────────────────────────────────────────────────
      - name: Install pl-core dependencies
        working-directory: pl-core
        run: npm ci

      - name: Write pl-core .env.test
        working-directory: pl-core
        run: echo "${{ secrets.PL_CORE_ENV_TEST }}" > .env.test

      - name: Run DB migrations
        working-directory: pl-core
        run: npm run db:migrate -- redo 9999 --envPath .env.test
        env:
          NODE_ENV: test

      - name: Build pl-core
        working-directory: pl-core
        run: npm run build

      - name: Start pl-core server (background)
        working-directory: pl-core
        run: node ./dist/src/app/bootstrap/index.js &
        env:
          NODE_ENV: test

      - name: Wait for pl-core to be healthy
        run: npx wait-on http://localhost:3001/health --timeout 30000

      # ── Frontend (pl-web) ─────────────────────────────────────────────────
      - name: Install pl-web dependencies
        run: yarn install --frozen-lockfile

      - name: Build pl-web (production)
        run: yarn build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Start pl-web preview (background)
        run: yarn preview --port 8080 &

      - name: Wait for pl-web to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          CI: true
          WEB_URL: http://localhost:8080
          MAILINATOR_API_TOKEN: ${{ secrets.MAILINATOR_API_TOKEN }}

      # ── Artifacts (on failure) ────────────────────────────────────────────
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7

name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout both repos ───────────────────────────────────────────────
      - name: Checkout pl-web
        uses: actions/checkout@v4

      - name: Checkout pl-core
        uses: actions/checkout@v4
        with:
          repository: purple-ledger/purple-ledger-core # ← update if org name differs
          path: pl-core
          token: ${{ secrets.GH_PAT }} # PAT with repo:read for pl-core
          submodules: true

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Backend (pl-core) ─────────────────────────────────────────────────
      - name: Install pl-core dependencies
        working-directory: pl-core
        run: npm ci

      - name: Write pl-core .env.test
        working-directory: pl-core
        run: echo "$PL_CORE_ENV" > .env.test
        env:
          PL_CORE_ENV: ${{ secrets.PL_CORE_ENV_TEST }}

      - name: Build pl-core routes
        working-directory: pl-core
        run: npm run build:routes

      - name: Start pl-core server (background)
        working-directory: pl-core
        run: yarn start:test > server.log 2>&1 &
        env:
          NODE_ENV: test

      - name: Wait for pl-core to be healthy
        run: npx wait-on tcp:localhost:3001 --timeout 120000 || (cat pl-core/server.log && exit 1)

      # ── Frontend (pl-web) ─────────────────────────────────────────────────
      - name: Install pl-web dependencies
        run: yarn install --frozen-lockfile

      - name: Build pl-web (production)
        run: yarn build
        env:
          VITE_API_URL: http://localhost:3001

      - name: Start pl-web preview (background)
        run: yarn preview --port 8080 &

      - name: Wait for pl-web to be ready
        run: npx wait-on http://localhost:8080 --timeout 30000

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --config e2e/playwright.config.ts
        env:
          CI: true
          WEB_URL: http://localhost:8080
          MAILINATOR_API_TOKEN: ${{ secrets.MAILINATOR_API_TOKEN }}

      # ── Artifacts (on failure) ────────────────────────────────────────────
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7
